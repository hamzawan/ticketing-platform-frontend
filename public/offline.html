<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection · Big Bounce America</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#F0F6FF;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{max-width:420px;width:100%}
  .brand{font-weight:900;font-size:14px;margin-bottom:28px}
  .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:#0066FF;display:flex;align-items:center;justify-content:center}
  h1{margin:0 0 10px;font-size:28px;font-weight:900}
  p{margin:0;font-size:14px;line-height:1.6;color:#64748b}
  button{margin-top:28px;padding:11px 24px;border:0;border-radius:12px;background:#0066FF;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 24px rgba(0,102,255,.35)}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">Big Bounce America</div>
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.83"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.7"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>No internet connection</h1>
    <p>Can't reach the server. Check your connection and try again. We'll reload automatically when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online",function(){location.reload()})</script>
</body>
</html>
